# YuriNovel Nginx 生产部署配置
# 使用方法：将此文件放入 /etc/nginx/conf.d/ 或合并到 /etc/nginx/nginx.conf 的 server 块
# 记得替换 server_name 和 root_path（项目根目录）

upstream lnms_backend {
    server 127.0.0.1:5000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;   # TODO: 替换为实际域名或服务器 IP

    # 项目根目录（需替换为实际路径）
    root /var/www/LightNovelResourceManagement;

    # 客户端上传文件大小限制（与 Flask MAX_CONTENT_LENGTH 一致：16MB）
    client_max_body_size 16M;

    # === 静态文件：由 Nginx 直接处理 ===
    location /static/ {
        alias /var/www/LightNovelResourceManagement/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # === 主请求：反向代理到 Gunicorn ===
    location / {
        proxy_pass http://lnms_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # === 健康检查 /favicon 忽略 ===
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}
