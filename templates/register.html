{% extends "base.html" %}
{% block title %}注册 — LNMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="card-title text-center mb-4">
          <i class="bi bi-person-plus me-1"></i> 注册
        </h4>
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="username">用户名</label>
            <input type="text" class="form-control" id="username" name="username"
                   required autofocus maxlength="50">
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">密码</label>
            <input type="password" class="form-control" id="password" name="password"
                   required minlength="6">
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirm_password">确认密码</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                   required minlength="6">
          </div>
          <button class="btn btn-primary w-100" type="submit">注册</button>
        </form>
        <p class="text-center mt-3 mb-0">
          已有账号？<a href="{{ url_for('auth.login') }}">登录</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
